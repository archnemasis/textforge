<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>TextForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230a84ff%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22%3ET%3C/text%3E%3C/svg%3E">
<meta name="description" content="Free text effect generator: game fonts with outlines and 3D shadows, PNG download, no limits.">
<style>
:root{--bg:#f4f4f4;--ink:#111;--mut:#777;--card:#fff;--line:#e2e2e2;--blue:#0a84ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;padding:18px 18px 60px}
main{max-width:1060px;margin:0 auto}
header{max-width:1060px;margin:0 auto 14px;display:flex;align-items:baseline;gap:12px}header h1{margin:0;font:800 26px system-ui,"Segoe UI",sans-serif;letter-spacing:-.02em}header h1 b{color:var(--blue)}header p{margin:0;color:var(--mut);font-size:14px}
footer{max-width:1060px;margin:28px auto 0;color:var(--mut);font-size:12px;text-align:center}
.stage{min-height:280px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px;border-radius:16px}
.stage.checker{background-image:linear-gradient(45deg,#d4d4d4 25%,transparent 25%,transparent 75%,#d4d4d4 75%),linear-gradient(45deg,#d4d4d4 25%,transparent 25%,transparent 75%,#d4d4d4 75%);background-size:20px 20px;background-position:0 0,10px 10px;background-color:#efefef}
canvas{flex:none}
.tabs{display:flex;gap:4px;margin:10px 0 0 8px;flex-wrap:wrap}
.tabs button{font:600 14px system-ui;letter-spacing:.02em;text-transform:uppercase;border:0;background:#ececec;color:#111;padding:14px 22px 16px;border-radius:20px 20px 0 0;cursor:pointer}
.tabs button.on{background:var(--card)}
.panel{background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:16px;position:relative;margin-top:-2px}
.panel>section{display:none}.panel>section.on{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.panel>section.on{grid-template-columns:1fr}}
section.three.on{grid-template-columns:repeat(3,1fr)}@media(max-width:900px){section.three.on{grid-template-columns:1fr}}
.col{display:grid;gap:14px;align-content:start}
textarea{width:100%;height:190px;font:inherit;font-size:17px;padding:14px;border-radius:12px;border:1px solid var(--line);resize:vertical;background:#fff;color:#111}
.ctl{display:grid;gap:4px}.ctl>span{color:var(--mut);font-size:14px}
.line{display:flex;align-items:center;gap:10px}.line input[type=range]{flex:1;min-width:0}
.reset-slider{
  border:1px solid var(--line);
  background:#fff;
  color:#555;
  border-radius:8px;
  padding:6px 10px;
  min-width:62px;
  cursor:pointer;
  font:600 12px system-ui,"Segoe UI",Roboto,sans-serif;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.reset-slider:hover{background:#eef5ff;border-color:#b8d8ff;color:var(--blue)}
.reset-slider:active{transform:translateY(1px)}
input[type=number]{width:78px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111}
input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  accent-color:var(--blue);
  height:22px;
  background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{
  height:10px;
  background:#d7d7d7;
  border-radius:999px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:18px;
  height:18px;
  margin-top:-4px;
  border:0;
  border-radius:50%;
  background:var(--blue);
  cursor:pointer;
}
input[type=range]::-moz-range-track{
  height:10px;
  background:#d7d7d7;
  border-radius:999px;
}
input[type=range]::-moz-range-thumb{
  width:18px;
  height:18px;
  border:0;
  border-radius:50%;
  background:var(--blue);
  cursor:pointer;
}
.unit{color:var(--mut);font-size:13px;width:14px}
.seg{display:flex;gap:6px;justify-content:flex-end}.seg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fp{position:relative}
#fpick{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:30px;padding:8px 18px;font-size:26px;cursor:pointer;color:#000;min-height:50px}
#fpick span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-transform:uppercase}
#flist{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:320px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;z-index:5}
#flist.open{display:block}
#flist button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:24px;cursor:pointer;text-transform:uppercase;color:#000}
#flist button:hover,#flist button.on{background:#eef5ff}
#flist .add{font:600 14px system-ui;color:var(--blue);text-transform:none;border-top:1px solid var(--line);border-radius:0;margin-top:6px}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw input{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;font-size:14px}
.sm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.big{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:14px 22px;font:600 16px system-ui;cursor:pointer}
h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
#note{font-size:13px;color:var(--mut);min-height:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111}
</style></head><body>
<header><h1>Text<b>Forge</b></h1><p>Game font text effects &middot; free &middot; no limits</p></header>
<main>
<div class="stage" id="stage"><canvas id="cv"></canvas></div>
<div class="tabs" id="tabs"><button data-t="text" class="on">Text</button><button data-t="styles">Styles</button><button data-t="bg">Background</button><button data-t="dl">Download</button></div>
<div class="panel">
<section id="t-text" class="on">
 <div class="col"><textarea id="txt" spellcheck="false" placeholder="Your text...">GAME
FONT</textarea>
 <label class="row"><input type="checkbox" id="keep"> Keep my colours &amp; sliders when switching fonts</label>
 <div class="seg" id="al"><button data-a="left">Left</button><button data-a="center" class="on">Center</button><button data-a="right">Right</button></div>
 <div class="fp"><div id="flist"></div><button id="fpick"><span id="fname"></span><svg width="22" height="22" viewBox="0 0 22 22"><g fill="#111"><circle cx="4" cy="4" r="2"/><circle cx="11" cy="4" r="2"/><circle cx="18" cy="4" r="2"/><circle cx="4" cy="11" r="2"/><circle cx="11" cy="11" r="2"/><circle cx="18" cy="11" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="11" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></g></svg></button></div>
 <div id="note"></div></div>
 <div class="col" id="c-text"></div>
</section>
<section id="t-styles" class="three">
 <div class="col"><h3>Filling</h3><div class="sw" id="sw"></div>
 <div class="line"><button class="sm" id="addc">+ Color</button><button class="sm" id="remc">- Color</button></div>
 <label class="row"><input type="checkbox" id="spc"> Spaces use up a color</label></div>
 <div class="col" id="c-out"><h3>Outline</h3></div>
 <div class="col" id="c-dep"><h3>3D shadow</h3></div>
</section>
<section id="t-bg">
 <div class="col"><h3>Background</h3><label class="row">Type <select id="bgm"><option value="none">Transparent</option><option value="color">Solid color</option></select></label>
 <label class="row">Color <input type="color" id="bgc" value="#ffffff" style="width:48px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0"></label>
 <label class="row"><input type="checkbox" id="chk"> Show checkerboard behind transparent</label></div><div></div>
</section>
<section id="t-dl">
 <div class="col"><h3>Download</h3><button class="big" id="save">Save PNG</button><div id="info" style="color:var(--mut);font-size:13px"></div></div><div></div>
</section>
</div></main>
<footer>Fonts belong to their creators and are for personal use. Not affiliated with TextStudio, Nintendo or Roblox.</footer>
<script src="fonts.js"></script>
<script>
const FONTS=(window.TF_FONTS||[]).map((f,i)=>({name:f.name,fam:'F'+i,url:f.file,sample:f.sample,preset:f.preset||{}}));
let PAL=['#009cda','#fcd000','#e71e07','#42b132','#fcd000','#e71e07','#42b132','#fcd000','#009cda','#42b132'];
const $=id=>document.getElementById(id);let curF=0,ALIGN='center';
const CTL={};
let drawRAF=0,fullDrawTimer=0;
function scheduleDraw(){
  if(!ready)return;
  if(!drawRAF){
    drawRAF=requestAnimationFrame(()=>{
      drawRAF=0;
      draw(true);
    });
  }
  clearTimeout(fullDrawTimer);
  fullDrawTimer=setTimeout(()=>draw(false),140);
}
function mk(host,id,label,min,max,step,val,unit){const d=document.createElement('div');d.className='ctl';
d.innerHTML='<span>'+label+':</span><div class="line"><input type="range" id="'+id+'_r" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"><input type="number" id="'+id+'_n" min="'+min+'" max="'+max+'" step="any" value="'+val+'"><span class="unit">'+unit+'</span><button type="button" class="reset-slider" id="'+id+'_reset" title="Revert '+label+' to '+val+unit+'">Revert</button></div>';
$(host).appendChild(d);const r=$(id+'_r'),n=$(id+'_n'),reset=$(id+'_reset');CTL[id]={r,n,min,max,def:val};
r.addEventListener('input',()=>{n.value=r.value;scheduleDraw()});
n.addEventListener('input',()=>{if(n.value!==''&&!isNaN(+n.value)){r.value=n.value;scheduleDraw()}});
n.addEventListener('blur',()=>{let v=parseFloat(n.value);if(isNaN(v))v=val;v=Math.min(max,Math.max(min,v));n.value=v;r.value=v;scheduleDraw()});
reset.addEventListener('click',()=>{r.value=val;n.value=val;scheduleDraw()})}
function g(id){const c=CTL[id];let v=parseFloat(c.n.value);if(isNaN(v))v=c.def;return Math.min(c.max,Math.max(c.min,v))}
mk('c-text','zoom','Zoom',0,100,1,50,'%');mk('c-text','sp','Character spacing',-50,150,1,0,'%');mk('c-text','lh','Line height',10,300,1,82,'%');mk('c-text','rot','Rotation',-180,180,0.5,0,'°');
mk('c-out','out','Size',0,100,1,30,'%');
mk('c-dep','dep','Length',0,100,1,20,'%');mk('c-dep','dang','Direction',-180,180,1,90,'°');
function colorRow(host,id,label,v){const d=document.createElement('label');d.className='row';d.innerHTML=label+' <input type="color" id="'+id+'" value="'+v+'" style="width:48px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0">';$(host).appendChild(d);$(id).addEventListener('input',scheduleDraw)}
colorRow('c-out','outc','Color','#000000');colorRow('c-dep','depc','Color','#000000');
function swatches(){const sw=$('sw');sw.innerHTML='';PAL.forEach((c,i)=>{const e=document.createElement('input');e.type='color';e.value=c;e.ariaLabel='Color '+(i+1);e.oninput=()=>{PAL[i]=e.value;scheduleDraw()};sw.appendChild(e)})}
swatches();$('addc').onclick=()=>{PAL.push('#cccccc');swatches();scheduleDraw()};$('remc').onclick=()=>{if(PAL.length>1){PAL.pop();swatches();scheduleDraw()}};
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b===e.target));document.querySelectorAll('.panel>section').forEach(s=>s.classList.toggle('on',s.id==='t-'+t))};
$('al').onclick=e=>{const a=e.target.dataset.a;if(!a)return;ALIGN=a;[...$('al').children].forEach(b=>b.classList.toggle('on',b===e.target));scheduleDraw()};
function area(src,tw,th){const sw=src.width,sh=src.height,o=document.createElement('canvas');o.width=tw;o.height=th;const oc=o.getContext('2d');
if(tw>=sw&&th>=sh){oc.imageSmoothingQuality='high';oc.drawImage(src,0,0,tw,th);return o}
const sd=src.getContext('2d').getImageData(0,0,sw,sh).data,rx=sw/tw,ry=sh/th,tmp=new Float32Array(tw*sh*4);
for(let tx=0;tx<tw;tx++){const a=tx*rx,b=(tx+1)*rx,i0=Math.floor(a),i1=Math.min(sw,Math.ceil(b));
for(let y=0;y<sh;y++){let R=0,G=0,B=0,A=0;for(let i=i0;i<i1;i++){const w=Math.min(b,i+1)-Math.max(a,i),p=(y*sw+i)*4,al=sd[p+3]/255*w;R+=sd[p]*al;G+=sd[p+1]*al;B+=sd[p+2]*al;A+=al}
const q=(y*tw+tx)*4;tmp[q]=R/rx;tmp[q+1]=G/rx;tmp[q+2]=B/rx;tmp[q+3]=A/rx}}
const out=oc.createImageData(tw,th),od=out.data;
for(let ty=0;ty<th;ty++){const a=ty*ry,b=(ty+1)*ry,j0=Math.floor(a),j1=Math.min(sh,Math.ceil(b));
for(let tx=0;tx<tw;tx++){let R=0,G=0,B=0,A=0;for(let j=j0;j<j1;j++){const w=Math.min(b,j+1)-Math.max(a,j),q=(j*tw+tx)*4;R+=tmp[q]*w;G+=tmp[q+1]*w;B+=tmp[q+2]*w;A+=tmp[q+3]*w}
R/=ry;G/=ry;B/=ry;A/=ry;const p=(ty*tw+tx)*4;if(A>0){od[p]=R/A;od[p+1]=G/A;od[p+2]=B/A;od[p+3]=A*255}}}
oc.putImageData(out,0,0);return o}
function fit(){const F=window.FULL;if(!F)return;const cv=$('cv'),Q=window.FQ||4,w=F.width/Q,h=F.height/Q,a=$('stage').clientWidth-42,f=Math.min(1,a/w),d=window.devicePixelRatio||1;
const tw=Math.max(1,Math.round(w*f*d)),th=Math.max(1,Math.round(h*f*d));
cv.width=tw;cv.height=th;const c=cv.getContext('2d');c.clearRect(0,0,tw,th);
c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(F,0,0,tw,th);
cv.style.width=tw/d+'px';cv.style.height=th/d+'px';
$('info').textContent='Saved picture size: '+F.width+' x '+F.height+' px'}
window.addEventListener('resize',fit);
let ready=false;
function draw(preview=false){if(!ready)return;
const fam='"'+FONTS[curF].fam+'"',S=12+g('zoom')/100*128,ls=g('sp')/100,lhe=g('lh')/100,rot=g('rot')*Math.PI/180,OUT=g('out')/100*0.5,DEP=g('dep')/100,ang=g('dang')*Math.PI/180,useSp=$('spc').checked;
const lines=$('txt').value.split(String.fromCharCode(10));
const m=document.createElement('canvas').getContext('2d');m.font=S+'px '+fam;
let w1=1;lines.forEach(l=>{w1=Math.max(w1,m.measureText(l).width+l.length*ls*S)});
const lim=rot?3000:7000,qMax=preview?2:4,Q=Math.max(1,Math.min(qMax,Math.floor(lim/(w1+S*1.2)))),F=S*Q,pad=Math.ceil(F*(0.35+DEP+OUT));
let W=Math.ceil(w1*Q)+pad*2,H=Math.ceil((lines.length-1)*lhe*F+F*1.6)+pad*2;
if(rot){const d=Math.ceil(Math.hypot(W,H));W=H=d}
const big=document.createElement('canvas');big.width=W;big.height=H;const gc=big.getContext('2d');
const bw=Math.ceil(w1*Q)+pad*2,bh=Math.ceil((lines.length-1)*lhe*F+F*1.6)+pad*2;
gc.translate(W/2,H/2);gc.rotate(rot);gc.translate(-bw/2,-bh/2);
gc.font=F+'px '+fam;gc.textBaseline='alphabetic';gc.lineJoin='miter';gc.miterLimit=10;gc.fontKerning='normal';gc.lineWidth=OUT*F;
const step=preview?Math.max(1.25,F/300):Math.max(0.5,F/600),D=DEP*F,dx=Math.cos(ang),dy=Math.sin(ang);let ci=0;const rows=[];
lines.forEach((ln,li)=>{const y=pad+F*0.85+li*lhe*F,row=[];
for(let i=0;i<ln.length;i++){const ch=ln[i];if(ch===' '){if(useSp)ci++;continue}
row.push({ch,x:gc.measureText(ln.slice(0,i)).width+i*ls*F,y,col:PAL[ci%PAL.length]});ci++}
if(row.length){const a=row[0],z=row[row.length-1],ma=gc.measureText(a.ch),mz=gc.measureText(z.ch),inkL=a.x-ma.actualBoundingBoxLeft,inkR=z.x+mz.actualBoundingBoxRight,iw=inkR-inkL,avail=bw-pad*2;
const sx=ALIGN=='left'?pad-inkL:ALIGN=='right'?pad+avail-inkR:pad+(avail-iw)/2-inkL;row.forEach(t=>{t.x+=sx})}
rows.push(row)});
const oc=$('outc').value,dc=$('depc').value;
rows.forEach(row=>{
// TextStudio-style layering: build the full 3D projection first.
for(let j=0;j<row.length;j++){const t=row[j];
gc.fillStyle=dc;gc.strokeStyle=dc;
for(let d=D;d>0;d-=step){gc.strokeText(t.ch,t.x+dx*d,t.y+dy*d);gc.fillText(t.ch,t.x+dx*d,t.y+dy*d)}
}
// Then place the coloured/outlined letter faces on top, in reverse-overlap order.
for(let j=row.length-1;j>=0;j--){const t=row[j];
gc.fillStyle=oc;gc.strokeStyle=oc;if(OUT>0)gc.strokeText(t.ch,t.x,t.y);
gc.fillStyle=t.col;gc.fillText(t.ch,t.x,t.y)
}
});
const px=gc.getImageData(0,0,W,H).data;let x0=W,x1=-1,y0=H,y1=-1;
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(px[(y*W+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
if(x1<0){window.FULL=null;const cv=$('cv');cv.width=cv.height=1;return}
const mg=Math.round(F*0.03),full=document.createElement('canvas');full.width=x1-x0+1+mg*2;full.height=y1-y0+1+mg*2;
full.getContext('2d').drawImage(big,x0,y0,x1-x0+1,y1-y0+1,mg,mg,x1-x0+1,y1-y0+1);window.FULL=full;window.FQ=Q;fit()}
function stageBg(){const s=$('stage');s.style.background=$('bgm').value=='color'?$('bgc').value:'';s.classList.toggle('checker',$('chk').checked&&$('bgm').value=='none')}
['bgm','bgc','chk'].forEach(i=>$(i).addEventListener('input',stageBg));
['txt','spc'].forEach(i=>$(i).addEventListener('input',scheduleDraw));
$('save').onclick=()=>{clearTimeout(fullDrawTimer);draw(false);if(!window.FULL)return;let c=window.FULL;if($('bgm').value=='color'){c=document.createElement('canvas');c.width=FULL.width;c.height=FULL.height;const x=c.getContext('2d');x.fillStyle=$('bgc').value;x.fillRect(0,0,c.width,c.height);x.drawImage(FULL,0,0)}
const a=document.createElement('a');
const rawName=($('txt').value.trim()
  .replace(/\s+/g,'-')
  .replace(/[^a-zA-Z0-9-_]/g,'')
  .replace(/-+/g,'-')
  .replace(/^-|-$/g,'') || 'text').toUpperCase();
const now=new Date();
const dd=String(now.getDate()).padStart(2,'0');
const mm=String(now.getMonth()+1).padStart(2,'0');
const yyyy=now.getFullYear();
a.download=rawName+'-'+dd+'-'+mm+'-'+yyyy+'.png';
a.href=c.toDataURL('image/png');a.click()};
function faceFor(f){if(!f.face){f.face=new FontFace(f.fam,f.buf?f.buf:'url('+f.url+')');}return f.face.load().then(x=>{document.fonts.add(x)})}
function setV(id,v){if(v==null||!CTL[id])return;CTL[id].r.value=v;CTL[id].n.value=v}
function applyPreset(f,prev){if($('keep').checked)return;const p=f.preset||{};
if(p.pal){PAL=p.pal.slice();swatches()}
['out','dep','dang','lh','sp','zoom','rot'].forEach(k=>setV(k,p[k]));
if(p.outc)$('outc').value=p.outc;if(p.depc)$('depc').value=p.depc;
const t=$('txt').value;if(f.sample&&(!t.trim()||(prev&&t===prev.sample)))$('txt').value=f.sample}
function renderList(){const l=$('flist');l.innerHTML='';FONTS.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.name;b.style.fontFamily='"'+f.fam+'"';b.className=i===curF?'on':'';b.onclick=()=>{const prev=FONTS[curF];curF=i;applyPreset(f,prev);$('fname').textContent=f.name;$('fname').style.fontFamily='"'+f.fam+'"';l.classList.remove('open');renderList();draw()};l.appendChild(b)});
const a=document.createElement('button');a.className='add';a.textContent='+ Add a font file (.ttf / .otf) for this session';a.onclick=()=>$('ffile').click();l.appendChild(a)}
const ff=document.createElement('input');ff.type='file';ff.accept='.ttf,.otf,.woff,.woff2';ff.id='ffile';ff.style.display='none';document.body.appendChild(ff);
ff.onchange=()=>{const f=ff.files[0];if(!f)return;f.arrayBuffer().then(buf=>{const o={name:f.name.replace(/[.][^.]*$/,''),fam:'U'+FONTS.length,buf};return faceFor(o).then(()=>{FONTS.push(o);curF=FONTS.length-1;$('fname').textContent=o.name;$('fname').style.fontFamily='"'+o.fam+'"';renderList();draw()})}).catch(()=>{$('note').textContent='That font file could not be loaded.'});ff.value=''};
$('fpick').onclick=e=>{e.stopPropagation();$('flist').classList.toggle('open')};document.addEventListener('click',e=>{if(!$('flist').contains(e.target))$('flist').classList.remove('open')});
Promise.all(FONTS.map(f=>faceFor(f).catch(()=>{f.broken=true}))).then(()=>{
// Hide fonts whose file is missing so they don't show up in a fallback font.
for(let i=FONTS.length-1;i>=0;i--)if(FONTS[i].broken)FONTS.splice(i,1);
if(!FONTS.length){$('note').textContent='No fonts could be loaded. Add font files to the fonts/ folder.';return}
ready=true;applyPreset(FONTS[0],null);$('fname').textContent=FONTS[0].name;$('fname').style.fontFamily='"'+FONTS[0].fam+'"';renderList();stageBg();draw()});
</script></body></html>
